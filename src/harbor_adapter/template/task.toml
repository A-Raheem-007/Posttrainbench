version = "1.0"

[metadata]
author_name = "PostTrainBench Team"
category = "ml-training"
tags = ["post-training", "llm", "fine-tuning", "gpu"]

[environment]
gpus = 1
# "H100!" (with the bang) requests an EXACT match, not "H100-or-compatible".
# Without it the provider is free to satisfy an H100 request with better
# hardware, and in practice every run we inspected was allocated an H200
# (141 GB VRAM vs 80 GB). That is not a free upgrade: in one real gpqamain
# run the agent read its own nvidia-smi output and concluded it could
# "comfortably do full fine-tuning of the 4B parameter Gemma-3 model in
# bfloat16" -- i.e. the extra VRAM changed its training strategy, where an
# 80 GB card would likely have pushed it toward LoRA/QLoRA. Since the
# paper's headline condition is explicitly 1x H100 at 80 GB, and its
# leaderboard is what our numbers get compared against, we pin the exact
# model for methodological fidelity and for consistency between our own
# samples. Cost: scheduling may queue longer when H100s are scarce.
gpu_types = ["H100!"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

# NOTE: no [environment.healthcheck] — the Turness/Modal harness launches the
# sandbox with its own keepalive command and execs the healthcheck straight in.
# A healthcheck that shells out to `pgrep -f 'tail -F'` (the old Modal-dashboard
# log-streamer probe) both (a) depends on a custom ENTRYPOINT we no longer set
# and (b) races container startup, surfacing as "Sandbox ... already shut down".
# The timer now self-initializes on first `timer.sh` call (see generate_timer_sh),
# so no healthcheck side effect is needed.

# The verifier runs in its OWN container (see environment_mode = "separate"
# below) and never reads final_model out of the agent's workspace. The model
# reaches it through the HF relay configured further down: the agent's
# checkpoint is published to a temporary private repo, only a small pointer
# travels through Harbor's artifact path, and the verifier downloads and
# hash-checks the files itself.
#
# That container boundary is the primary protection: the agent cannot reach
# evaluate.py, the judges, or the reward logic at all. Two software-level checks
# are kept on top of it as defence in depth, since they cost nothing and catch
# a tampered or mis-built package as well as a hostile agent:
#   1. A checksum manifest of every verifier-owned file (evaluate.py,
#      contamination_judge.py, report_results.py, templates/, evaluation_code/,
#      task_context/*, test_data.json), computed at task-generation time and
#      baked into tests/metadata.json, re-verified by test.sh before scoring.
#      Surfaces as the verifier_integrity reward dimension.
#   2. The contamination judge (test.sh + contamination_judge.py) checks whether
#      the agent's own code or session logs show it reading anything under
#      /tests/. Surfaces as judge_evaluation_access.
#
# HISTORY, because this comment previously said the opposite: the task did run in
# shared mode for a while, where the verifier read /home/agent/workspace/
# final_model in place. That was forced by the transfer limits noted under
# [verifier] below, not chosen, and the relay removed the constraint.
# timeout_sec = 14400.0 (4h), not 10800.0 (3h): test.sh's own single-attempt
# evaluation budget was raised to 10800s to give healthbench/arenahardwriting
# enough headroom even with slower/larger models, so the overall verifier
# envelope needed the same increase to leave real margin for the judge and
# the checks that run before it.
[verifier]
timeout_sec = 14400.0
# Separate: the verifier runs in its own container, so the agent (which has
# root in its own) cannot reach evaluate.py, the judges, or the reward logic.
# That is the reference pipeline's design and what the client requires.
#
# This was previously "shared" because the model could not be moved into a
# second container: normal artifact transfers are capped at 5 GiB per object
# (SandboxFilesystemFileTooLargeError, eval_147030) and the /logs/artifacts
# workaround fails to archive at 7.9 GB (eval_147559). The model now travels
# outside Harbor entirely via the HF relay below, so the transfer limit no
# longer constrains the architecture.
environment_mode = "separate"

# Mirrors [environment] so vLLM, flash-attn and model loading behave
# identically on both sides.
[verifier.environment]
gpus = 1
gpu_types = ["H100!"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

# Runs after the agent phase ends, before artifact capture, inside the agent's
# container. Publishes the checkpoint to a private, randomly-named HF repo and
# writes a few hundred bytes of pointer JSON that Harbor then carries.
#
# WHY NOT JUST DECLARE final_model AS AN ARTIFACT: Harbor copies every declared
# artifact to the host output directory BEFORE the verifier starts and then
# feeds the verifier FROM that host copy (artifact_handler.upload_artifacts()).
# The verifier's input and the user's download are the same object, so any
# model delivered that way is necessarily an 8 GB download that cannot be
# retrieved. Measured in eval_147963: two identical 4 MB artifacts were
# shipped, the verifier deleted one and left the other as a control, and both
# arrived in the download at full size. There is no ArtifactConfig field that
# excludes an entry from the output and no post-verify hook to clean it up.
#
# `|| true` is deliberately ABSENT: a publish failure must leave no pointer, so
# the verifier fails closed with a clear message rather than grading nothing.
# __PTB_TASK_SLUG__ is replaced at generation time with the Harbor task id.
[[verifier.collect]]
service = "main"
command = """bash -c 'set -eu
python3 /home/agent/workspace/publish_model.py \
  --model-dir /home/agent/workspace/final_model \
  --audit-dir /home/agent/workspace/audit \
  --pointer /tmp/fm.pointer.json \
  --result /logs/artifacts/relay-publication-result.json \
  --task-slug __PTB_TASK_SLUG__
test -s /tmp/fm.pointer.json
test -s /logs/artifacts/relay-publication-result.json
'"""
timeout_sec = 3600.0

[verifier.env]
# ":-" default (not a bare "${OPENAI_API_KEY}") so Harbor's resolve_env_vars()
# doesn't hard-fail task launch when no key is configured — the contamination
# judge is optional; test.sh already degrades gracefully and just skips it
# when CODEX_API_KEY is empty.
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
CODEX_API_KEY = "${OPENAI_API_KEY:-}"
# Judge endpoint. Empty by default, which makes test.sh use the plain
# https://api.openai.com/v1. Set this on the host only for a regionally
# provisioned key. eval_150839 lost every judge attempt to a hardcoded
# regional host returning "incorrect regional hostname"; the ":-" guard is
# required because resolve_env_vars() hard-fails on a bare ${VAR} that the
# host environment does not define.
CODEX_BASE_URL = "${CODEX_BASE_URL:-}"
# NOTE: deliberately NOT passing CODEX_JUDGE_MODEL through here. Turness's
# resolve_env_vars() strictly requires every ${VAR} referenced in
# [verifier.env] to exist in the HOST environment invoking the trial, or it
# raises ValueError and refuses to launch the verifier at all -- unlike
# bash, it does not gracefully fall back to empty for an unset var. Learned
# this the hard way: adding CODEX_JUDGE_MODEL here broke verification
# outright (killed a 40-minute trial before test.sh ever ran) because the
# host environment didn't have it set. tests/test.sh's own
# ${CODEX_JUDGE_MODEL:-gpt-5.1} bash default is safe on its own -- it never
# requires the var to exist anywhere -- so the override capability lives
# there only. To change the judge model, edit tests/test.sh directly.

[agent]
timeout_sec = 36000.0

# Archive source and small experiment artifacts for postmortem review.
# final_model is excluded deliberately, and must stay excluded: the verifier
# fetches the weights over the HF relay instead, so exporting them here would
# reintroduce the multi-GB transfer the relay exists to avoid (5 GiB per-object
# cap, and an archive failure at 7.9 GB) and would put an undownloadable
# artifact in every reviewer's output folder. A correct run downloads in single
# digit megabytes for an 8 GB model.
#
# The contamination judge in test.sh reads the agent's code via
# `cd $WORKSPACE && codex exec ...` — the workspace transfer supplies
# everything under /home/agent/workspace/ minus the excludes below.
# The only thing the relay needs Harbor to carry. A few hundred bytes: the
# repo id, the pinned commit, and a per-file SHA-256 manifest the verifier
# re-checks after download to detect a corrupted transfer.
[[artifacts]]
source = "/tmp/fm.pointer.json"
destination = "fm.pointer.json"

# The agent's source code, for the judges and for postmortem review.
# final_model stays excluded: it travels via the relay, and including it here
# would put the 8 GB back into the download, which is the whole problem.
[[artifacts]]
source = "/home/agent/workspace"
destination = "workspace"
exclude = [
    "final_model",
    # Standard hygiene:
    "__pycache__",
    "*.pyc",
    ".git",
    ".venv",
    "venv",
    # HF / transformers / datasets caches (often many GB):
    ".cache",
    ".huggingface",
    # Experiment tracking:
    "wandb",
    ".wandb",
    # Training output dirs commonly produced by HF Trainer / Hydra:
    "checkpoint-*",
    "runs",
    "outputs",
    "output",
    "logs",
    # Tokenized dataset shards (large, not useful for judge):
    "*.arrow",
    "*.parquet",
    # Misc:
    "tmp",
    ".tmp",
]
